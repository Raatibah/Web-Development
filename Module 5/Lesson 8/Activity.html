<!DOCTYPE html>
<html>

<head>
    <title>
        Galaxy Digital
    </title>
    <script src="
        https://cdn.tailwindcss.com/
        "></script>
</head>

<body class="text-gray-800 antialiased selection:bg-indigo-100 bg-gray-50/30">
    <header class="fixed w-full top-0 z-50 bg-white/90 backdrop-blur border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-gray-900">Galaxy <span class="text-indigo-600"></span></a>
            <nav class="hidden md:flex gap-8 font-medium text-sm text-gray-600">

                <a href="#contacts" class="hover:text-indigo-600">Contact</a>
                <a href="#work" class="hover:text-indigo-600">Work</a>

            <button class="md: hidden text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            <div class="flex flex-col sm:flex-row justify-center gap-4">
