<!DOCTYPE html>
<html>

<head>
    <title>
        Tailwind Flexbox and Grid
    </title>
    <script src="
        https://cdn.tailwindcss.com/
        "></script>
</head>

<body>
    <section class="max-w-6xl mx-auto px-6 py-10">
        <h2 class="text-3xl font-bold text-center mb-8">Meet our team</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-center font-semibold">Sarah</h2>
                <p class="text-center text-gray-500">Designer</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-center font-semibold">Mike</h2>
                <p class="text-center text-gray-500">Developer</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-center font-semibold">Emma</h2>
                <p class="text-center text-gray-500">Manager</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-center font-semibold">Jason</h2>
                <p class="text-center text-gray-500">Marketing</p>
            </div>
        </div>
    </section>
</body>


</html>
