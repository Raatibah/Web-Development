<!DOCTYPE html>
<html>

<head>
    <title>
        Tailwind transitions and animations
    </title>
    <script src="
        https://cdn.tailwindcss.com/
        "></script>
</head>

<body>
    <div class="flex items-center justify-center min-h-screen bg-gray-300">
        <div class="space-x-4">
            <button class="bg-blue-500 text-white px-6 py-3 rounded transition duration-300 hover:bg-green-500">Button 1</button>
            <button class="bg-purple-500 text-white px-6 py-3 rounded transition duration-500 ease-in-out hover:scale-110">Button 2</button>
            <button class="bg-red-500 text-white px-6 py-3 rounded transition duration-300 hover:bg-orange-500 hover:shadow-xl hover:-translate-y-3">Button 3</button>
        </div>
    </div>
    <div class="flex items-center justify-center min-h-screen bg-gray-100">
        <div class="">
        <img src="https://img.magnific.com/free-photo/portrait-white-man-isolated_53876-40306.jpg?semt=ais_hybrid&w=740&q=80" alt="" srcset="" class="w-24 h-24 rounded-full mx-auto mb-4 transition duration-300 hover:scale-110">
        </div>
    </div>
</body>


</html>
